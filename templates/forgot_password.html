<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Smart Expense Tracker</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e293b,
                    #312e81
                );
        }

        .container {
            width: 400px;
            padding: 40px;

            background: rgba(255, 255, 255, 0.95);

            border-radius: 20px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #111827;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;

            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #d1d5db;
            border-radius: 10px;

            margin-bottom: 20px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #6366f1;

            box-shadow:
                0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 10px;

            background: #4f46e5;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
            transform: translateY(-1px);
        }

        .error-message {
            background: #fee2e2;
            color: #b91c1c;

            padding: 12px;

            border-radius: 10px;

            margin-bottom: 20px;

            text-align: center;

            font-size: 14px;
        }

        .success-message {
            background: #dcfce7;
            color: #166534;

            padding: 12px;

            border-radius: 10px;

            margin-bottom: 20px;

            text-align: center;

            font-size: 14px;

            line-height: 1.5;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #4f46e5;

            font-weight: bold;

            text-decoration: none;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            🔐
        </div>

        <h1>
            Forgot Password?
        </h1>

        <p class="subtitle">
            Enter your registered email address and
            we'll send you a password reset link.
        </p>

        {% if error %}

        <div class="error-message">
            ❌ {{ error }}
        </div>

        {% endif %}

        {% if message %}

        <div class="success-message">
            ✅ {{ message }}
        </div>

        {% endif %}

        <form
            method="POST"
            action="/forgot-password"
        >

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your registered email"
                required
            >

            <button type="submit">
                Send Reset Link
            </button>

        </form>

        <div class="back">

            <a href="/login">
                ← Back to Login
            </a>

        </div>

    </div>

</body>

</html>
